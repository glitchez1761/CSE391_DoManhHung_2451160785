      </div>
      <div class="card"><img src="https://picsum.photos/300?8" alt="Sp">

      </div>

    <aside class="ads-bar">
      <h3>Quảng cáo</h3>
      <img src="https://picsum.photos/300?9" alt="Ads">

  <footer class="footer">
