<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <div class="form-card">
            <div class="form-header">
                <div class="logo">✦</div>
                <h1>Tạo tài khoản</h1>
                <p>Điền thông tin để đăng ký</p>
            </div>

            <form id="registerForm" novalidate>

                <div class="field-group" id="fg-name">
                    <label for="inputName">Họ và tên</label>
                    <div class="input-wrap">
                        <input type="text" id="inputName" name="name" placeholder="Nguyễn Văn A" autocomplete="name"
                            aria-describedby="err-name">
                        <span class="field-icon" aria-hidden="true"></span>
                    </div>
                    <span class="field-msg" id="err-name" role="alert"></span>
                </div>

                <div class="field-group" id="fg-email">
                    <label for="inputEmail">Email</label>
                    <div class="input-wrap">
                        <input type="email" id="inputEmail" name="email" placeholder="example@email.com"
                            autocomplete="email" aria-describedby="err-email">
                        <span class="field-icon" aria-hidden="true"></span>
                    </div>
                    <span class="field-msg" id="err-email" role="alert"></span>
                </div>

                <div class="field-group" id="fg-password">
                    <label for="inputPassword">Mật khẩu</label>
                    <div class="input-wrap">
                        <input type="password" id="inputPassword" name="password" placeholder="••••••••"
                            autocomplete="new-password" aria-describedby="err-password strength-label">
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Hiện/ẩn mật khẩu">👁</button>
                    </div>
                    <div class="strength-bar-wrap" aria-hidden="true">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <span class="strength-label" id="strength-label"></span>
                    <span class="field-msg" id="err-password" role="alert"></span>
                </div>

                <div class="field-group" id="fg-confirm">
                    <label for="inputConfirm">Xác nhận mật khẩu</label>
                    <div class="input-wrap">
                        <input type="password" id="inputConfirm" name="confirm" placeholder="••••••••"
                            autocomplete="new-password" aria-describedby="err-confirm">
                        <span class="field-icon" aria-hidden="true"></span>
                    </div>
                    <span class="field-msg" id="err-confirm" role="alert"></span>
                </div>

                <div class="field-group" id="fg-phone">
                    <label for="inputPhone">Số điện thoại</label>
                    <div class="input-wrap">
                        <input type="tel" id="inputPhone" name="phone" placeholder="0901-234-567" autocomplete="tel"
                            maxlength="12" aria-describedby="err-phone">
                        <span class="field-icon" aria-hidden="true"></span>
                    </div>
                    <span class="field-msg" id="err-phone" role="alert"></span>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn" disabled>
                    Đăng ký ngay →
                </button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="successModal" hidden aria-modal="true" role="dialog" aria-label="Đăng ký thành công">
        <div class="modal-box">
            <div class="modal-icon">🎉</div>
            <h2>Đăng ký thành công!</h2>
            <div class="modal-info" id="modalInfo"></div>
            <button class="modal-close" id="modalClose">Hoàn tất</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
