<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>B3 - Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>
    <div class="grid-container">
        <header class="header">HEADER</header>
        
        <section class="hero">
            <div class="hero-text">HERO BANNER</div>
            <div class="hero-featured-card">SẢN PHẨM NỔI BẬT</div>
        </section>

        <aside class="sidebar">
            <h3>BỘ LỌC</h3>
            <label><input type="checkbox"> Apple</label><br>
            <label><input type="checkbox"> Samsung</label>
        </aside>

        <main class="main-content">
            <div class="product-item">Card 1</div>
            <div class="product-item">Card 2</div>
            <div class="product-item">Card 3</div>
            <div class="product-item">Card 4</div>
            <div class="product-item">Card 5</div>
            <div class="product-item">Card 6</div>
        </main>

        <aside class="ads">
            <h3>QC</h3>
            <img src="https://placehold.co/200x400" alt="Banner QC" style="max-width: 100%; border-radius: 8px;">
        </aside>

        <footer class="footer">FOOTER</footer>
    </div>
</body>
</html>
